<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>潮目 / TIDELINES</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#1b4249,#071923 75%);color:#e7f1eb;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:16px}main{width:min(720px,100%)}header{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.tag{color:#9de2c5;letter-spacing:.2em;font-size:11px}h1{font-weight:500;letter-spacing:.08em;margin:3px 0}.desc{font-size:13px;color:#a9c1b8;line-height:1.6}.stats{display:flex;gap:8px}.stat{border:1px solid #41616a;border-radius:10px;padding:7px 11px;text-align:center;min-width:70px}.stat small{display:block;color:#9db4ad;font-size:10px}.stat b{font-size:18px;font-weight:500}.frame{position:relative;border:1px solid #42636a;border-radius:16px;overflow:hidden;box-shadow:0 18px 55px #0008}canvas{display:block;width:100%;height:auto;touch-action:none}.overlay{position:absolute;inset:0;background:#06151ecb;display:grid;place-items:center;padding:20px;text-align:center}.overlay.off{display:none}.dialog{max-width:370px;background:#102d37;border:1px solid #537078;border-radius:16px;padding:22px}.dialog h2{font-weight:500;margin:0 0 8px}.dialog p{font-size:14px;line-height:1.8;color:#c1d3cd}button{background:#204b50;color:#eef8f0;border:1px solid #64827f;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;color:#9db4ad;font-size:12px;line-height:1.7}.pad{display:grid;grid-template-columns:repeat(3,40px);gap:4px}.pad button{padding:5px}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}@media(max-width:480px){header{align-items:start;flex-direction:column}.bottom{flex-direction:column}.pad{order:-1}}
</style>
<main><header><div><div class="tag">A SMALL GAME ABOUT CURRENTS</div><h1>潮目 / TIDELINES</h1><div class="desc">流れに逆らうより、流れを読む。光のかけらを集めて灯台へ。</div></div><div class="stats"><div class="stat"><small>光</small><b id="score">0 / 5</b></div><div class="stat"><small>船体</small><b id="hp">3</b></div></div></header>
<div class="frame"><canvas id="c" width="720" height="540"></canvas><div class="overlay" id="ov"><div class="dialog"><div class="tag">TIDELINES · 01</div><h2 id="ttl">流れの向こうへ</h2><p id="msg">小舟は潮に流される。舵を切って光を5つ集めよう。岩に3回ぶつかると岸へ戻される。矢印キー / WASD で操作。</p><button id="go">航海をはじめる</button></div></div></div>
<div class="bottom"><div>矢印キー / WASD または下の舵で操作。<br>舵を切ると加速。何もしなくても潮に流される。</div><div class="pad"><button class="up" data-k="ArrowUp">↑</button><button class="left" data-k="ArrowLeft">←</button><button class="down" data-k="ArrowDown">↓</button><button class="right" data-k="ArrowRight">→</button></div><button id="reset">最初から</button></div></main>
<script>
(()=>{
const c=document.querySelector('#c'),x=c.getContext('2d'),W=720,H=540,cw=60,ch=60,score=document.querySelector('#score'),hp=document.querySelector('#hp'),ov=document.querySelector('#ov'),ttl=document.querySelector('#ttl'),msg=document.querySelector('#msg'),go=document.querySelector('#go');
const rocks=[[3,2],[4,2],[7,3],[8,3],[5,6],[8,6],[2,5]],spots=[[2,1],[5,1],[9,5],[3,7],[10,7]];
let keys={},boat,shards,particles,goal,health,collected,t=0,last=0,running=false,raf=0;
function center(a){return[(a[0]+.5)*cw,(a[1]+.5)*ch]}
function setup(){let p=center([1,7]);boat={x:p[0],y:p[1],vx:0,vy:0,a:0,blink:0};goal=center([10,1]);shards=spots.map((p,i)=>({p:center(p),taken:false,phase:i*1.8}));particles=[];health=3;collected=0;stats();draw()}
function stats(){score.textContent=collected+' / 5';hp.textContent=health}
function flow(px,py){let a=Math.sin(py*.01+t*.0005)+Math.cos(px*.008-t*.0004),b=Math.cos(px*.009+t*.0004)+Math.sin(py*.012-t*.0003),n=Math.hypot(a,b)||1;return[a/n,b/n]}
function inp(){let a=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),b=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),n=Math.hypot(a,b)||1;return[a/n,b/n]}
function hit(px,py){if(px<15||px>W-15||py<15||py>H-15)return true;let cx=Math.floor(px/cw),cy=Math.floor(py/ch);return rocks.some(r=>r[0]===cx&&r[1]===cy)}
function burst(px,py,color){for(let i=0;i<15;i++){let a=Math.random()*6.28,s=25+Math.random()*85;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.7+Math.random()*.5,color})}}
function update(dt){t+=dt;let[ix,iy]=inp(),[fx,fy]=flow(boat.x,boat.y);boat.vx+=(ix*180+fx*40)*dt;boat.vy+=(iy*180+fy*40)*dt;boat.vx*=Math.pow(.982,dt*60);boat.vy*=Math.pow(.982,dt*60);let sp=Math.hypot(boat.vx,boat.vy);if(sp>190){boat.vx*=190/sp;boat.vy*=190/sp}let nx=boat.x+boat.vx*dt,ny=boat.y+boat.vy*dt;
if(hit(nx,boat.y)){boat.vx*=-.45;nx=boat.x;if(boat.blink<=0){health--;boat.blink=1;burst(boat.x,boat.y,'#e9a88b')}}if(hit(boat.x,ny)){boat.vy*=-.45;ny=boat.y;if(boat.blink<=0){health--;boat.blink=1;burst(boat.x,boat.y,'#e9a88b')}}boat.x=nx;boat.y=ny;boat.blink=Math.max(0,boat.blink-dt);if(sp>8)boat.a=Math.atan2(boat.vy,boat.vx);
shards.forEach(s=>{if(!s.taken&&Math.hypot(boat.x-s.p[0],boat.y-s.p[1])<22){s.taken=true;collected++;stats();burst(...s.p,'#f2d28b')}});if(collected===5&&Math.hypot(boat.x-goal[0],boat.y-goal[1])<27){running=false;burst(...goal,'#9de2c5');show('潮が、道になった。','光をすべて集めて灯台に着いた。もう一度、潮に出てみる？','もう一度航海',start)}if(health<=0){running=false;show('岸へ戻ろう。','岩にぶつかりすぎた。潮の向きを見て、もう一度。','再出発',start)}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.l-=dt});particles=particles.filter(p=>p.l>0)}
function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#123944');g.addColorStop(1,'#071b29');x.fillStyle=g;x.fillRect(0,0,W,H);for(let y=0;y<H;y+=68)for(let xx=0;xx<W;xx+=72){let[a,b]=flow(xx,y),ang=Math.atan2(b,a);x.save();x.translate(xx,y);x.rotate(ang);x.strokeStyle='#9de2c526';x.beginPath();x.moveTo(-8,0);x.lineTo(9,0);x.lineTo(4,-4);x.moveTo(9,0);x.lineTo(4,4);x.stroke();x.restore()}
rocks.forEach(r=>{x.fillStyle='#1a3c46';x.strokeStyle='#45636a';x.lineWidth=1.5;x.beginPath();x.roundRect(r[0]*cw+5,r[1]*ch+5,cw-10,ch-10,12);x.fill();x.stroke();x.fillStyle='#31545c';x.beginPath();x.ellipse((r[0]+.5)*cw,(r[1]+.43)*ch,13,8,-.4,0,7);x.fill()});x.save();x.translate(...goal);x.strokeStyle=collected===5?'#9de2c5':'#638b88';x.lineWidth=2;x.beginPath();x.arc(0,0,22+Math.sin(t*.003)*3,0,7);x.stroke();x.fillStyle='#e9dba9';x.fillRect(-2,-19,4,10);x.restore();
shards.forEach(s=>{if(s.taken)return;x.save();x.translate(...s.p);x.rotate(t*.0008+s.phase);x.shadowColor='#f2d28b';x.shadowBlur=14;x.fillStyle='#f2d28b';x.beginPath();x.moveTo(0,-10);x.lineTo(7,0);x.lineTo(0,10);x.lineTo(-7,0);x.fill();x.restore()});x.strokeStyle='#c4e6dc55';x.lineWidth=2;x.beginPath();x.moveTo(boat.x-boat.vx*.22,boat.y-boat.vy*.22);x.lineTo(boat.x-boat.vx*.1,boat.y-boat.vy*.1);x.stroke();x.save();x.translate(boat.x,boat.y);x.rotate(boat.a+Math.PI/2);x.globalAlpha=boat.blink>0&&Math.floor(t/90)%2===0?.3:1;x.shadowColor='#9de2c5';x.shadowBlur=14;x.fillStyle='#d9eee2';x.beginPath();x.moveTo(0,-15);x.quadraticCurveTo(12,-2,8,12);x.lineTo(-8,12);x.quadraticCurveTo(-12,-2,0,-15);x.fill();x.restore();particles.forEach(p=>{x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.color;x.beginPath();x.arc(p.x,p.y,2.5,0,7);x.fill();x.globalAlpha=1});x.fillStyle='#04151dbb';x.beginPath();x.roundRect(14,14,180,30,8);x.fill();x.fillStyle='#d1e2d9';x.font='12px system-ui';x.fillText(collected===5?'灯台が呼んでいる':'光のかけらを探す',25,34)}
function show(a,b,c,fn){ttl.textContent=a;msg.textContent=b;go.textContent=c;go.onclick=fn;ov.classList.remove('off')}
function start(){setup();ov.classList.add('off');running=true;last=performance.now();cancelAnimationFrame(raf);loop(last)}
function loop(now){if(!running)return;let dt=Math.min(.034,(now-last)/1000||.016);last=now;update(dt);draw();raf=requestAnimationFrame(loop)}
go.onclick=start;document.querySelector('#reset').onclick=start;window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k.startsWith('arrow')||k===' ')e.preventDefault();keys[k]=true});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>keys[k]=false))});setup();
})();
</script>
